name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Exactly what the pre-push hook runs. Do not add or remove steps here
      # without changing the hook too: two check lists is how local and CI drift
      # apart (AGENTS.md §10, "CI is truth").
      - name: Verify
        run: pnpm verify
