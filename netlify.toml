# Netlify alternative. The recorded provider is Cloudflare Workers static assets,
# configured by wrangler.jsonc; this file keeps a switch to Netlify a configuration
# change rather than a code change.
[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
